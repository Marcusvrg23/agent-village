name: testes

on:
  push:
    branches: [main, feat/agent-village]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Sem npm install: o app não tem dependências de produção e os testes usam só módulos node:*.
      - run: node --test

  docker:
    name: Docker (build + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pastas de exemplo do host
        run: mkdir -p ~/.claude/projects ~/.codex/sessions ~/.agent-village && chmod 777 ~/.agent-village
      - run: docker compose up -d --build
      - name: Vila respondendo dentro do container
        run: |
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:4173/village/ | grep -q "Agent Village"
          curl -fsS http://127.0.0.1:4173/api/village/state | grep -q '"allowedApiSpendUsd":0'
          curl -fsS http://127.0.0.1:4173/api/village/state | grep -q '"control":false'
      - if: always()
        run: docker compose logs


  visual-smoke:
    name: Screenshot real da missão (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Chromium e harness
        run: |
          npm install --no-save --omit=dev --package-lock=false playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Smoke real em navegador
        run: node scripts/mission-ui-smoke.mjs
      - name: Guardar imagens e diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-village-smoke-visual
          path: artifacts/mission-smoke/
          if-no-files-found: warn
      - name: Adicionar screenshots na branch para revisão
        if: success()
        run: |
          mkdir -p docs/screenshots/mission-smoke
          cp artifacts/mission-smoke/*.png docs/screenshots/mission-smoke/
          cp artifacts/mission-smoke/smoke-report.json docs/screenshots/mission-smoke/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/mission-smoke/
          git diff --cached --quiet || (git commit -m "docs: screenshot real do smoke visual da missão" && git push origin HEAD:fix/mission-complete-output)
